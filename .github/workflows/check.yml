name: Checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # tests/stubs (symcon/SymconStubs, gepinnt)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: PHP-Syntax
        run: |
          php -l BlindController/module.php
          php -l BlindControlGroupMaster/module.php
          php -l tests/check_locale.php
          php -l tests/harness.php
          php -l tests/check-level-conversion.php
      - name: Code-Stil (schlankes eigenes Regelwerk, siehe .php-cs-fixer.php)
        run: |
          wget -q https://cs.symfony.com/download/php-cs-fixer-v3.phar
          PHP_CS_FIXER_IGNORE_ENV=1 php php-cs-fixer-v3.phar fix --dry-run --diff --using-cache=no --allow-risky=yes

      - name: JSON-Validität
        run: |
          find . -name '*.json' -not -path './.git/*' -not -path './tests/stubs/*' -print0 |
            xargs -0 -n1 php -r 'json_decode(file_get_contents($argv[1]), false, 512, JSON_THROW_ON_ERROR); echo $argv[1], " ok\n";' --
      - name: Übersetzungen
        run: php tests/check_locale.php
      - name: Umrechnung Profilwerte/Prozent
        run: php tests/check-level-conversion.php
